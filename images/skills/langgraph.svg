<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="n1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="n2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Edges -->
  <line x1="50" y1="22" x2="20" y2="72" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="50" y1="22" x2="80" y2="72" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="20" y1="72" x2="80" y2="72" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="50" y1="22" x2="50" y2="72" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" opacity="0.4" stroke-dasharray="4 3"/>
  <!-- Nodes -->
  <circle cx="50" cy="22" r="12" fill="url(#n1)"/>
  <circle cx="20" cy="72" r="12" fill="url(#n2)"/>
  <circle cx="80" cy="72" r="12" fill="url(#n2)"/>
  <!-- Mid node -->
  <circle cx="50" cy="72" r="7" fill="#a78bfa" opacity="0.9"/>
  <!-- White centers -->
  <circle cx="50" cy="22" r="4.5" fill="white" opacity="0.9"/>
  <circle cx="20" cy="72" r="4.5" fill="white" opacity="0.9"/>
  <circle cx="80" cy="72" r="4.5" fill="white" opacity="0.9"/>
  <circle cx="50" cy="72" r="2.5" fill="white" opacity="0.8"/>
</svg>
