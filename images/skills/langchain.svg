<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Left hexagon -->
  <polygon points="30,19 44,19 51,31 44,43 30,43 23,31"
    fill="none" stroke="url(#g)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right hexagon -->
  <polygon points="56,57 70,57 77,69 70,81 56,81 49,69"
    fill="none" stroke="url(#g)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Connecting link -->
  <line x1="44" y1="43" x2="56" y2="57" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
  <!-- Inner fill dots for depth -->
  <circle cx="37" cy="31" r="4" fill="#34d399" opacity="0.5"/>
  <circle cx="63" cy="69" r="4" fill="#34d399" opacity="0.5"/>
</svg>
