<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="doc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Document body -->
  <rect x="12" y="10" width="46" height="58" rx="5" fill="url(#doc)"/>
  <!-- Folded corner -->
  <polygon points="44,10 58,10 58,24" fill="#1e3a8a"/>
  <polyline points="44,10 44,24 58,24" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
  <!-- Text lines on doc -->
  <rect x="20" y="32" width="28" height="3.5" rx="2" fill="#93c5fd" opacity="0.7"/>
  <rect x="20" y="41" width="28" height="3.5" rx="2" fill="#93c5fd" opacity="0.7"/>
  <rect x="20" y="50" width="18" height="3.5" rx="2" fill="#93c5fd" opacity="0.7"/>
  <!-- Vector dots (embedding representation) -->
  <circle cx="20" cy="22" r="2.5" fill="#bfdbfe" opacity="0.8"/>
  <circle cx="27" cy="22" r="2.5" fill="#bfdbfe" opacity="0.6"/>
  <circle cx="34" cy="22" r="2.5" fill="#bfdbfe" opacity="0.9"/>
  <!-- Magnifier circle -->
  <circle cx="66" cy="66" r="18" fill="none" stroke="url(#lens)" stroke-width="5"/>
  <circle cx="66" cy="66" r="10" fill="#0c4a6e" opacity="0.6"/>
  <!-- Magnifier cross-hair -->
  <line x1="66" y1="58" x2="66" y2="74" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <line x1="58" y1="66" x2="74" y2="66" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <!-- Handle -->
  <line x1="79" y1="79" x2="90" y2="90" stroke="url(#lens)" stroke-width="6" stroke-linecap="round"/>
</svg>
