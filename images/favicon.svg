<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08081a"/>
      <stop offset="100%" stop-color="#12122c"/>
    </linearGradient>
    <linearGradient id="txt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(79,142,247,0.35)" stroke-width="1.5"/>
  <!-- VR text -->
  <text x="32" y="43" font-family="'Arial Black', Impact, sans-serif" font-size="26" font-weight="900"
    fill="url(#txt)" text-anchor="middle" letter-spacing="-1" filter="url(#glow)">VR</text>
  <!-- Bottom accent line -->
  <rect x="20" y="50" width="24" height="2.5" rx="1.5" fill="url(#txt)" opacity="0.7"/>
</svg>
